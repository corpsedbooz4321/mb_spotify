<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Spotify Authorization</title>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <link href="/auth_assets/main.css" rel="stylesheet">
  <script src="/auth_assets/main.js"></script>
</head>
<body>
  <main>
    <div class="logo">
      <img src="/auth_assets/chibi-anime-boy.gif" width="140" height="140" alt="Success" />
    </div>
    
    <h1><span class="checkmark">✓</span>Success!</h1>
    
    <p class="success-message">
      Spotify Authorization was successful. You can close this tab and go back to your app.
    </p>
    
    <div class="alert-box">
      <span class="alert-badge">Tip</span>
      <span class="alert-text">
        If the app does not detect the authorization, make sure you use one of the following supported browsers:
        <div class="browser-list">
          <span class="browser-tag">Chrome</span>
          <span class="browser-tag">Edge</span>
          <span class="browser-tag">Firefox</span>
        </div>
      </span>
    </div>
  </main>
</body>
</html>
